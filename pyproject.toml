[project]
name = "bargeboard"
version = "0.1.0"
description = "Replay F1 race sessions as OpenTelemetry signals."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastf1>=3.7.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "typer>=0.23.2",
]

[project.scripts]
bargeboard = "bargeboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bargeboard"]

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: quality (Go ${{ matrix.go_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go_version: ["1.27.4"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          version: ${{ matrix.go_version }}

      - name: Check Go distribution
        run: make check

      - name: Check receiver races
        run: go test -mod=readonly -race -count=1 -timeout=5m ./receiver/f1livetimingreceiver

      - name: Test pushed range check
        run: bash scripts/check-push-diff_test.sh

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Check pushed range
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: bash scripts/check-push-diff.sh

      - name: Check tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  version:
    name: resolve snapshot version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Install release tools
        uses: ./.github/actions/setup-release-tools
      - name: Resolve snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/resolve-release-version.sh)"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  release_build:
    name: release build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64_v1
          - runner: ubuntu-24.04-arm
            target: linux_arm64_v8.0
          - runner: macos-15
            target: darwin_arm64_v8.0
          - runner: windows-2025
            target: windows_amd64_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build independent native binaries
        uses: ./.github/actions/build-native
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.version.outputs.version }}

      - name: Validate Windows configuration
        if: matrix.target == 'windows_amd64_v1'
        shell: pwsh
        env:
          CC: C:/mingw64/bin/gcc.exe
          CXX: C:/mingw64/bin/g++.exe
        run: |
          $profileHome = $HOME
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:HOME = $profileHome
          go test -mod=readonly -run '^TestShippedConfigResolvesTokenFileFromHome$' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-candidate/bargeboard-native-candidate-windows_amd64_v1.exe" validate --config config.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    name: release package
    needs: [version, release_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install release tools
        uses: ./.github/actions/setup-release-tools
        with:
          actionlint: "true"

      - name: Verify packaging tools
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            7f488e727e1d49ca7cf7463b78ebfa7307fbbb9741075ef33d75223c004657a2 \
            "$(command -v goreleaser)" | sha256sum --check --strict
          printf '%s  %s\n' \
            17cc40c1e40dbfdeb8c84b6d9928909bceb793f22e8a8023ef408625f1d96ec5 \
            "$(command -v syft)" | sha256sum --check --strict
          test "$(go version)" = "go version go1.27.4 linux/amd64"
          actionlint -version

      - name: Check workflow definitions
        run: actionlint -color

      - name: Test release-ref validation
        run: |
          bash scripts/build-release_test.sh
          bash scripts/build-native-release_test.sh
          bash scripts/verify-native-release-inputs_test.sh
          bash scripts/resolve-release-version_test.sh
          bash scripts/generate-release-sbom_test.sh
          bash scripts/go-toolchain_test.sh
          bash scripts/release-workflow_test.sh
          bash scripts/verify-sha256_test.sh
          bash scripts/validate-release-ref_test.sh
          bash scripts/verify-release-ref_test.sh
          bash scripts/validate-release-controls_test.sh
          bash scripts/validate-release-binary_test.sh
          bash scripts/validate-release-sbom_test.sh
          node --test scripts/publish-release_test.cjs

      - name: Check release scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit
          done

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Download native binaries from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bargeboard-native-*
          path: ${{ runner.temp }}/bargeboard-native-inputs
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error

      - name: Verify native inputs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VCS_MODIFIED: "false"
        run: |
          set -euo pipefail
          native_binaries="$RUNNER_TEMP/bargeboard-native-inputs"
          bash scripts/verify-native-release-inputs.sh "$native_binaries"
          printf 'NATIVE_BINARIES=%s\nNATIVE_BUILD_SET=candidate\n' "$native_binaries" >>"$GITHUB_ENV"

      - name: Build release snapshot
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean --skip=publish
          jq -e --arg version "$EXPECTED_VERSION" '.version == $version' build/release/metadata.json

      - name: Record release subject digests
        id: first_build
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'digests<<EOF\n'
            sha256sum \
              build/release/*.tar.gz \
              build/release/*.zip \
              build/release/*.sbom.spdx.json \
              build/release/checksums.txt
            printf 'EOF\n'
          } >>"$GITHUB_OUTPUT"

      - name: Clone independent reproducibility source
        env:
          REPRODUCIBILITY_ROOT: ${{ runner.temp }}/bargeboard-repro-source
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$REPRODUCIBILITY_ROOT"
          git -C "$REPRODUCIBILITY_ROOT" checkout --detach "$GITHUB_SHA"

      - name: Rebuild release snapshot
        env:
          GOCACHE: ${{ runner.temp }}/bargeboard-repro-go-build
          GOMODCACHE: ${{ runner.temp }}/bargeboard-repro-go-mod
          NATIVE_BUILD_SET: reference
        working-directory: ${{ runner.temp }}/bargeboard-repro-source
        run: |
          touch -t 200001010000 LICENSE README.md config.yaml
          goreleaser release --snapshot --clean --skip=publish

      - name: Check reproducible release subjects
        env:
          FIRST_BUILD_DIGESTS: ${{ steps.first_build.outputs.digests }}
        shell: bash
        working-directory: ${{ runner.temp }}/bargeboard-repro-source
        run: |
          set -euo pipefail
          current="$(sha256sum \
            build/release/*.tar.gz \
            build/release/*.zip \
            build/release/*.sbom.spdx.json \
            build/release/checksums.txt)"
          test "$current" = "$FIRST_BUILD_DIGESTS"

      - name: Test release artifacts
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_GO_VERSION: go1.27.4
          EXPECTED_VCS_MODIFIED: "false"
        run: bash scripts/verify-release-artifacts_test.sh build/release

      - name: Check module files are unchanged
        run: |
          git diff --exit-code -- go.mod go.sum
          git diff --cached --exit-code -- go.mod go.sum

  check:
    name: check
    needs:
      - quality
      - version
      - release_build
      - package
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful prerequisite jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release_build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$VERSION_RESULT" != "success" ] || [ "$RELEASE_BUILD_RESULT" != "success" ] || [ "$PACKAGE_RESULT" != "success" ]; then
            printf 'quality=%s\nversion=%s\nrelease_build=%s\npackage=%s\n' "$QUALITY_RESULT" "$VERSION_RESULT" "$RELEASE_BUILD_RESULT" "$PACKAGE_RESULT"
            exit 1
          fi

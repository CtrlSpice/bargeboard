receivers:
  f1livetiming:
    auth:
      token_file: ${env:HOME}/.config/bargeboard/f1tv-token
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318

processors:
  batch:
    send_batch_size: 8192
    send_batch_max_size: 20000
    timeout: 1s

exporters:
  desktop:

extensions:
  duckdb:
    endpoint: 127.0.0.1:8000
    otlp_http_port: 4318
    otlp_grpc_port: 4317
    db: ./bargeboard.duckdb
    db_max_size: "0"

service:
  extensions: [duckdb]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
                without_scope_info: true
                without_units: true
                without_type_suffix: true
  pipelines:
    traces:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [desktop]
    metrics:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [desktop]
    logs:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [desktop]

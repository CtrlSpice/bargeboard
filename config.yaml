receivers:
  f1livetiming:
    auth:
      token_file: ${env:HOME}/.config/bargeboard/f1tv-token
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318

processors:
  batch:
    send_batch_size: 8192
    send_batch_max_size: 20000
    timeout: 1s

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
                without_scope_info: true
                without_units: true
                without_type_suffix: true
  pipelines:
    traces:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [f1livetiming, otlp]
      processors: [batch]
      exporters: [debug]
